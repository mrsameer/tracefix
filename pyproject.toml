[project]
name = "tracefix"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tracefix = "tracefix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracefix"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
